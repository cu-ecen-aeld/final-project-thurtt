# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-meshtasticd"
BBFILE_PATTERN_meta-meshtasticd = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-meshtasticd = "6"

LAYERDEPENDS_meta-meshtasticd = "core"
LAYERSERIES_COMPAT_meta-meshtasticd = "scarthgap"
